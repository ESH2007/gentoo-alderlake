# /etc/iwd/main.conf — iwd gestiona Wi‑Fi y DHCP, sin NetworkManager
[General]
EnableNetworkConfiguration=true
AddressRandomization=network

[Network]
NameResolvingService=systemd
EnableIPv6=true

[DriverQuirks]
# Descomenta si tu tarjeta (p. ej. Realtek) pierde la conexión con ahorro de energía
#PowerSaveDisable=*
