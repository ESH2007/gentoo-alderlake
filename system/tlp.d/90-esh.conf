# /etc/tlp.d/90-esh.conf  (sys-power/tlp)
# Corriente: rendimiento. Batería: eficiencia sin que el escritorio se sienta lento.

TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=0

# --- CPU (intel_pstate + EPP) -------------------------------------------------
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_MAX_PERF_ON_BAT=80

# Perfil de plataforma ACPI (ventiladores/límites de potencia de HP)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# --- GPU Intel ------------------------------------------------------------------
INTEL_GPU_MIN_FREQ_ON_BAT=100
INTEL_GPU_BOOST_FREQ_ON_BAT=900

# --- PCIe / NVMe / USB --------------------------------------------------------------
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1

# --- Wi‑Fi y audio --------------------------------------------------------------------
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- Batería ----------------------------------------------------------------------------
# HP no suele exponer umbrales de carga; si `tlp-stat -b` los muestra, descomenta:
#START_CHARGE_THRESH_BAT0=75
#STOP_CHARGE_THRESH_BAT0=80
