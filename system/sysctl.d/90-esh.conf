# /etc/sysctl.d/90-esh.conf

# zram es muy barato: el kernel debe preferir comprimir páginas antes que
# tirar la caché de archivos. Valores recomendados para zram.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Portátil: agrupa escrituras a disco (menos despertares del SSD)
vm.dirty_writeback_centisecs = 1500
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Sin watchdog NMI: ahorra un despertar periódico por núcleo
kernel.nmi_watchdog = 0

# Escritorio más ágil con muchos archivos abiertos (editores, navegadores)
fs.inotify.max_user_watches = 524288
