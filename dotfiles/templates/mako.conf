# Generado por esh-theme ({{NAME}}) → ~/.config/mako/config
font=JetBrains Mono 10
width=360
height=160
margin=12
padding=14
border-size=2
border-radius=10
icons=1
max-icon-size=40
default-timeout=5000
ignore-timeout=0
layer=overlay
anchor=top-right
background-color={{BG_ALT}}
text-color={{FG}}
border-color={{ACCENT}}
progress-color=over {{SURFACE}}

[urgency=low]
border-color={{SURFACE}}

[urgency=critical]
border-color={{URGENT}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
