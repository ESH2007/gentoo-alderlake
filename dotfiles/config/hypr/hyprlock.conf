# ~/.config/hypr/hyprlock.conf
source = ~/.config/esh/current/hyprlock.conf

general {
    hide_cursor = true
    grace = 3
}

background {
    path = ~/.config/esh/current/wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    text = $TIME
    color = $fg
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $fg
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    size = 320, 52
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $urgent
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = Contraseña incorrecta
    rounding = 10
    position = 0, -20
    halign = center
    valign = center
}
