# ~/.config/hypr/hyprland.conf — escritorio ESH
# Colores: ~/.config/esh/current/hyprland.conf (lo genera `esh-theme`)
# Ver todos los atajos: SUPER + K

# --- Pantalla ------------------------------------------------------------------
# Panel interno del portátil a su resolución nativa, escala 1.
# Si es 1080p de 14", prueba escala 1.25:  monitor = eDP-1, preferred, auto, 1.25
monitor = , preferred, auto, 1

# --- Programas -----------------------------------------------------------------
$terminal = alacritty
$launcher = wofi --show drun
$browser = firefox-bin
$editor = alacritty -e nvim

# --- Arranque ------------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = swaybg -i ~/.config/esh/current/wallpaper -m fill
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = LIBVA_DRIVER_NAME,iHD

# --- Aspecto (ligero: sin blur, animaciones cortas) -----------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        # El blur cuesta GPU y batería. SUPER+CTRL+B lo activa/desactiva.
        enabled = false
        size = 6
        passes = 2
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = suave, 0.2, 0.9, 0.1, 1.0
    animation = windows, 1, 3, suave, popin 85%
    animation = fade, 1, 3, suave
    animation = workspaces, 1, 3, suave, slide
    animation = border, 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                 # no redibuja si nada cambia → menos consumo
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

render {
    direct_scanout = 1         # juegos/vídeo a pantalla completa sin componer
}

# Colores del tema actual (después de los bloques anteriores para sobrescribir)
source = ~/.config/esh/current/hyprland.conf

# --- Entrada -------------------------------------------------------------------
input {
    kb_layout = es
    # Latinoamericano:  kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# Gesto de 3 dedos para cambiar de escritorio (Hyprland ≥ 0.51)
gesture = 3, horizontal, workspace

# --- Atajos (bindd = con descripción, la muestra SUPER+K) ----------------------
$mod = SUPER

bindd = $mod, Return, Terminal, exec, $terminal
bindd = $mod, Space, Lanzador de aplicaciones, exec, $launcher
bindd = $mod ALT, Space, Menú ESH, exec, esh-menu
bindd = $mod, Escape, Menú de apagado, exec, esh-menu sistema
bindd = $mod, B, Navegador, exec, $browser
bindd = $mod, N, Editor (Neovim), exec, $editor
bindd = $mod, K, Ver atajos de teclado, exec, esh-keys
bindd = $mod CTRL, T, Cambiar tema, exec, esh-menu temas
bindd = $mod CTRL, P, Modo de energía, exec, esh-menu energia
bindd = $mod CTRL, B, Activar/desactivar blur, exec, esh-blur
bindd = $mod CTRL, L, Bloquear pantalla, exec, hyprlock
bindd = $mod CTRL, N, No molestar, exec, makoctl mode -t do-not-disturb

bindd = $mod, W, Cerrar ventana, killactive
bindd = $mod, F, Pantalla completa, fullscreen, 0
bindd = $mod, M, Maximizar, fullscreen, 1
bindd = $mod, T, Ventana flotante, togglefloating
bindd = $mod, J, Cambiar división, togglesplit
bindd = $mod, P, Pseudo mosaico, pseudo

bindd = $mod, left, Foco a la izquierda, movefocus, l
bindd = $mod, right, Foco a la derecha, movefocus, r
bindd = $mod, up, Foco arriba, movefocus, u
bindd = $mod, down, Foco abajo, movefocus, d
bindd = $mod SHIFT, left, Mover ventana a la izquierda, swapwindow, l
bindd = $mod SHIFT, right, Mover ventana a la derecha, swapwindow, r
bindd = $mod SHIFT, up, Mover ventana arriba, swapwindow, u
bindd = $mod SHIFT, down, Mover ventana abajo, swapwindow, d
bindd = $mod, minus, Reducir ventana, resizeactive, -80 0
bindd = $mod, plus, Ampliar ventana, resizeactive, 80 0

bindd = $mod, Tab, Escritorio siguiente, workspace, e+1
bindd = $mod SHIFT, Tab, Escritorio anterior, workspace, e-1
bindd = $mod, S, Escritorio temporal, togglespecialworkspace, scratch
bindd = $mod SHIFT, S, Enviar al escritorio temporal, movetoworkspace, special:scratch

bindd = $mod, 1, Escritorio 1, workspace, 1
bindd = $mod, 2, Escritorio 2, workspace, 2
bindd = $mod, 3, Escritorio 3, workspace, 3
bindd = $mod, 4, Escritorio 4, workspace, 4
bindd = $mod, 5, Escritorio 5, workspace, 5
bindd = $mod, 6, Escritorio 6, workspace, 6
bindd = $mod, 7, Escritorio 7, workspace, 7
bindd = $mod, 8, Escritorio 8, workspace, 8
bindd = $mod, 9, Escritorio 9, workspace, 9
bindd = $mod SHIFT, 1, Mover a escritorio 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Mover a escritorio 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Mover a escritorio 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Mover a escritorio 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Mover a escritorio 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Mover a escritorio 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Mover a escritorio 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Mover a escritorio 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Mover a escritorio 9, movetoworkspace, 9

bindd = , Print, Captura de una zona, exec, esh-screenshot zona
bindd = SHIFT, Print, Captura de pantalla completa, exec, esh-screenshot pantalla
bindd = $mod, Print, Captura de la ventana activa, exec, esh-screenshot ventana

bindmd = $mod, mouse:272, Mover ventana con el ratón, movewindow
bindmd = $mod, mouse:273, Redimensionar con el ratón, resizewindow

# Teclas multimedia (funcionan también con la pantalla bloqueada)
bindeld = , XF86AudioRaiseVolume, Subir volumen, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Bajar volumen, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Silenciar, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Silenciar micrófono, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Subir brillo, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Bajar brillo, exec, brightnessctl -e4 -n2 set 5%-
bindld = , XF86AudioPlay, Reproducir/pausa, exec, playerctl play-pause
bindld = , XF86AudioNext, Siguiente pista, exec, playerctl next
bindld = , XF86AudioPrev, Pista anterior, exec, playerctl previous

# Ajustes personales sin tocar este archivo
source = ~/.config/hypr/local.conf
