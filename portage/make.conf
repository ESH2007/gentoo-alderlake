# /etc/portage/make.conf
# Gentoo para HP con Intel Core i3 12.ª gen (Alder Lake), 8 GB RAM, SSD 512 GB.
# Prioridades: rendimiento en escritorio y duración de batería.

# --- Compilador -------------------------------------------------------------
# -march=alderlake activa AVX2/FMA/SHA/VAES... del i3 12.ª gen.
# -O2 es la opción estable; -O3 rara vez mejora algo y rompe paquetes.
COMMON_FLAGS="-march=alderlake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=alderlake -C opt-level=2"

# Generado con: emerge -1 app-portage/cpuid2cpuflags && cpuid2cpuflags
# Vuelve a ejecutarlo en tu equipo y sustituye la línea si difiere.
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

# --- Paralelismo --------------------------------------------------------------
# 8 GB de RAM: ~2 GB por proceso de compilación → -j4.
# -l6 frena nuevos procesos cuando la carga sube (no congela el escritorio).
MAKEOPTS="-j4 -l6"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=6 --with-bdeps=y --keep-going --getbinpkg"
PORTAGE_NICENESS="15"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

# --- Paquetes binarios (binhost oficial x86-64-v3) -------------------------------
# Los paquetes pesados (gcc, llvm, rust, qt, mesa...) se descargan ya compilados
# si sus USE coinciden. Ver binrepos.conf/gentoobinhost.conf.
# Antes del primer uso:  getuto
FEATURES="getbinpkg binpkg-request-signature parallel-fetch"
BINPKG_FORMAT="gpkg"

# --- USE globales (mínimas) ----------------------------------------------------------
# El perfil desktop/systemd ya trae dbus, X (para XWayland), udev, etc.
USE="wayland pipewire vaapi vulkan screencast \
     -kde -plasma -gnome -gnome-online-accounts -qt5 \
     -cups -bluetooth -telemetry -doc -handbook"

VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
L10N="es es-ES en"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# --- Rutas ---------------------------------------------------------------------------
# /var/tmp/portage se monta en tmpfs (ver docs/INSTALL.md, fstab).
PORTAGE_TMPDIR="/var/tmp"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

LC_MESSAGES=C.utf8
